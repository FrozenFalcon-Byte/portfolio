<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>Ajinkya Chavan — AI/ML Engineer</title>
    <meta name="description" content="AI/ML engineer building generative systems: multi-agent frameworks, retrieval pipelines, and the full-stack architecture that carries them into production." />
    <meta property="og:title" content="Ajinkya Chavan — AI/ML Engineer" />
    <meta property="og:description" content="Generative AI systems, multi-agent frameworks, and full-stack architecture." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <script>
      /* Applied before first paint so a returning dark-mode (or large
         text) visitor never sees the defaults flash past. */
      /* The browser restores the previous scroll offset on reload, which
         lands the visitor mid-page — and with pinned sections, often in
         a section they never asked for. We decide where the page opens. */
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      try {
        var p = JSON.parse(localStorage.getItem('ac-prefs') || '{}');
        var t = p.theme || localStorage.getItem('ac-theme');
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var h = document.documentElement;
        h.dataset.theme = t === 'dark' ? 'dark' : 'light';
        if (p.text === 'large') h.dataset.text = 'large';
        if (t === 'dark') {
          document.querySelector('meta[name="theme-color"]').content = '#0B0B0C';
        }
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
